version: 1
skill: stainless-steel-laser-passivation

# Only these small, stable interfaces are loaded for every auditable request.
always_load:
  - path: references/analysis-record-schema.yaml
    purpose: validate the persistent analysis record
  - path: references/source-map.schema.yaml
    purpose: validate source-map CSV rows
  - path: references/evidence-index.schema.yaml
    purpose: validate evidence-index JSONL entries

# Domain references are loaded only when their topic is requested. Planned
# entries are explicit so a missing reference cannot be mistaken for a loaded
# one during the early build stages.
on_demand:
  - id: laser_process_metrology
    trigger: laser parameters, dose, beam overlap, scan geometry, thermal history
    path: references/laser-process-metrology.md
    schema: references/laser-process-record.schema.yaml
    comparability_schema: references/laser-comparability.schema.yaml
    source_manifest: references/laser-process-source-manifest.csv
    source_anchors: references/laser-process-source-anchors.csv
    status: present
  - id: passive_film_formation
    trigger: passive film, film growth, defects, stability, mechanism boundary
    path: references/passive-film-formation.md
    source_anchors: references/s4-film-chemistry-source-anchors.csv
    status: present
  - id: surface_chemistry_xps
    trigger: XPS, oxidation state, peak fitting, sputtering, depth and calibration
    path: references/surface-chemistry-xps.md
    schema: references/xps-record.schema.yaml
    source_manifest: references/xps-source-manifest.csv
    source_anchors: references/s4-film-chemistry-source-anchors.csv
    status: present
  - id: corrosion_electrochemistry
    trigger: OCP, PDP, passivation potential, pitting potential, EIS, Mott-Schottky, Mott Schottky, 钝化电位, 点蚀电位, 电化学阻抗, 莫特-肖特基, corrosion comparison
    path: references/corrosion-performance-evidence.md
    schema: references/electrochem-record.schema.yaml
    source_anchors: references/s5-performance-source-anchors.csv
    status: present
  - id: aging_stability
    trigger: immersion, salt spray, long-term exposure, degradation or recovery
    path: references/aging-stability.md
    source_anchors: references/s5-performance-source-anchors.csv
    status: present
  - id: measurement_quality
    trigger: repeats, uncertainty, statistics, reference electrode, fit quality
    path: references/measurement-quality.md
    source_anchors: references/s5-performance-source-anchors.csv
    status: present
  - id: conventional_comparators
    trigger: nitric, citric, electropolishing, mechanical-passivation comparison
    path: references/passive-film-formation.md
    source_anchors: references/s4-film-chemistry-source-anchors.csv
    covered_by: references/passive-film-formation.md#传统钝化对照
    status: present

  - id: literature_retrieval_playbook
    trigger: literature search, retrieval, query construction, false positive, mismatch, grep trap, encoding, coverage check, 检索, 误捞, 排除词
    path: references/literature-retrieval-playbook.md
    status: present
  - id: experimental_design_checklist
    trigger: experimental design, minimum design requirements, control group, dose window, as-treated state, repeats, 实验设计, 对照, 剂量窗口
    path: references/experimental-design-checklist.md
    status: present
  - id: data_audit_checklist
    trigger: data audit, unit check, self-consistency, recompute, statistical validity, ingest check, 数据审查, 单位核验, 复算
    path: references/data-audit-checklist.md
    status: present
  - id: paper_internal_contradiction_patterns
    trigger: internal contradiction, self-inconsistency, statement conflict, label swap, tautology, 矛盾, 不自洽, 互相冲突
    path: references/paper-internal-contradiction-patterns.md
    status: present
  - id: fullpool_read_record_index
    trigger: full-pool read record, deep-read index, has_target_data, mismatch_type, 精读索引, 全池记录
    path: references/fullpool-read-record-index.md
    status: present
  - id: negative_thresholds
    trigger: negative result, counterexample, dose window limit, laser degraded corrosion, 负面, 反例, 劣化
    path: references/laser-passivation-negative-thresholds.md
    status: present
  - id: laser_plus_electrochem
    trigger: laser and electrochemistry same paper, laser plus DL-EPR, laser plus Epit, 激光加电化学
    path: references/laser-plus-electrochem-evidence.md
    status: present
  - id: laser_plus_electrochem_p4_addendum
    trigger: L7 batch, laser and XPS addendum, measured Mott-Schottky, 补漏批次
    path: references/laser-plus-electrochem-p4-addendum.md
    status: present

# For multi-topic requests, load the union of the listed paths. These rules are
# additive and do not expand always_load.
cross_topic_rules:
  - id: aging_with_xps_endpoint
    when: aging/stability evidence is requested together with an XPS endpoint, including a single-time-point XPS check
    required_paths:
      - references/aging-stability.md
      - references/surface-chemistry-xps.md
      - references/xps-record.schema.yaml
    add_if_requested:
      film_mechanism:
        - references/passive-film-formation.md
      electrochemistry:
        - references/corrosion-performance-evidence.md

outputs:
  fast_path: references/fast-path-output-template.md
  auditable_path: references/auditable-analysis-record.template.yaml
