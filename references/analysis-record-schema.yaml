$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "stainless-steel-laser-passivation/analysis-record-schema"
title: Stainless Steel Laser Passivation Analysis Record
type: object
additionalProperties: false
required: [record_id, request, scope, sources, evidence, comparability, decision]
properties:
  record_id:
    type: string
    minLength: 1
  request:
    $ref: "#/$defs/request"
  scope:
    type: object
    additionalProperties: false
    required: [material_systems, laser_processes, environments, comparators]
    properties:
      material_systems: {type: array, items: {type: string}}
      laser_processes: {type: array, items: {type: string}}
      environments: {type: array, items: {type: string}}
      comparators: {type: array, items: {type: string}}
  sources:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/source"
  evidence:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/evidence"
  comparability:
    type: object
    additionalProperties: false
    required: [status, reasons]
    properties:
      status:
        type: string
        enum: [comparable, partially_comparable, not_comparable, needs_user_review]
      reasons:
        type: array
        items: {type: string}
  decision:
    type: object
    additionalProperties: false
    required: [mode, primary_skill, collaborators, user_review_required]
    properties:
      mode: {type: string, enum: [fast_path, auditable_path]}
      primary_skill: {type: string, const: stainless-steel-laser-passivation}
      collaborators: {type: array, items: {type: string}}
      user_review_required: {type: boolean}
$defs:
  request:
    type: object
    additionalProperties: false
    required: [text, origin, primary_skill]
    properties:
      text: {type: string, minLength: 1}
      origin: {type: string, enum: [real_session, historical_task, synthetic]}
      primary_skill: {type: string, const: stainless-steel-laser-passivation}
  source:
    type: object
    additionalProperties: false
    required: [source_id, anchors]
    properties:
      source_id: {type: string, minLength: 1}
      zotero_key: {type: string}
      local_path: {type: string}
      sha256: {type: string}
      anchors: {type: array, minItems: 1, items: {type: string}}
  evidence:
    type: object
    additionalProperties: false
    required: [claim_id, text, evidence_type, status, source_ids, missing_or_blocked]
    properties:
      claim_id: {type: string, minLength: 1}
      text: {type: string, minLength: 1}
      evidence_type:
        type: string
        enum: [reported_observation, derived_value, author_interpretation, agent_inference]
      status:
        type: string
        enum: [supported, partially_supported, uncertain, contradicted, needs_user_review]
      source_ids: {type: array, minItems: 1, items: {type: string}}
      missing_or_blocked: {type: array, items: {type: string}}
