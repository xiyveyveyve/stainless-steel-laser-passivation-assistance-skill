    expected_primary_skill: stainless-steel-laser-passivation
    allowed_collaborators: [materials-reader, materials-reviewer]
    forbidden_primary_skills: [materials-polishing, materials-figure]
    rationale: "需要领域内矛盾分析和证据边界控制。"
  - case_id: S1-P04
