# Stage-1 routing behavior corpus for the final Skill.
# The counts below are trigger-test cases, not literature-source counts.
# These prompts are intentionally short and do not contain the expected answer.
schema_version: "1.0"
suite_id: "S1-routing-behavior"
description: >-
  Natural-language routing corpus for checking whether the stainless-steel
  laser-passivation Skill wins domain-synthesis requests while yielding
  retrieval, extraction, data, DOE, figure, writing, review, and submission
  tasks to their more specific Skills.
counts:
  positive_trigger_cases: 20
  negative_trigger_cases: 30
  boundary_cases: 15
cases:
  # Positive triggers: the requested deliverable is a domain judgment,
  # cross-paper synthesis, contradiction audit, or evidence-boundary report.
  - case_id: S1-P01
    class: positive_trigger
    request: "判断 316L 激光钝化是否真正改善耐蚀性，并把论文中的观察、作者解释和我的推断分开。"
    origin: real_session
    expected_primary_skill: stainless-steel-laser-passivation
    allowed_collaborators: [materials-citation, materials-reader, materials-data]
    forbidden_primary_skills: [materials-literature-pipeline, materials-polishing, materials-reviewer]
    rationale: "需要围绕不锈钢激光钝化证据做分层科学判断，而不是单纯读文献。"
  - case_id: S1-P02
    class: positive_trigger
    request: "比较两篇 304L 激光扫描论文的能量密度、光斑、搭接率和腐蚀协议，判断哪些结果可直接比较。"
    origin: historical_task
    expected_primary_skill: stainless-steel-laser-passivation
    allowed_collaborators: [materials-reader, materials-citation]
    forbidden_primary_skills: [materials-doe, materials-figure, materials-literature-pipeline]
    rationale: "核心产物是激光钝化跨论文可比性判断。"
  - case_id: S1-P03
